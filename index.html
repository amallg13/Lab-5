<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Whispers of Nature</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container" id="scene">

        <video id="waterfall" autoplay muted loop playsinline>
            <source src="media/waterfall.mp4" type="video/mp4">
        </video>

        <div class="overlay"></div>

        <main>
            <h1>Whispers of Nature</h1>
            <p>Take a moment to slow down and listen to nature.</p>

            <div class="controls">
                <button id="soundButton">Play Sound</button>
                <button id="modeButton">Night Mode</button>
                <button id="focusButton">Focus on Waterfall</button>
            </div>

            <label for="volume">Volume</label>
            <input type="range" id="volume" min="0" max="1" step="0.1" value="0.5">

            <p id="status">Sound is paused</p>
        </main>

        <audio id="natureSound" loop>
            <source src="media/whisper of nature.mp3" type="audio/mpeg">
        </audio>

    </div>

    <script src="script.js"></script>
</body>
</html>
